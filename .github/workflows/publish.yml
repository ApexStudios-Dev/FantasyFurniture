name: Publish

on:
    push:
        branches: [ "**/main" ]
        paths: [ "**/src/**" ]

permissions:
    contents: read
    pull-requests: read

jobs:
    determine-module-changes:
        name: Determine Module Changes
        uses: ./.github/workflows/_module-changes.yml

    publish:
        name: Publish
        needs: determine-module-changes
        uses: ./.github/workflows/_publish-modules.yml
        secrets: inherit
        with:
            modules: ${{ needs.determine-module-changes.outputs.changes }}
            release_type: alpha
