on:
    workflow_dispatch:
    push:
        branches: [ "**/main" ]
        paths: [ "**/src/**" ]

jobs:
    get-vars:
        name: Get Variables
        runs-on: apexstudios
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Determine version
              uses: paulhatch/semantic-version@v5.4.0
              id: version
              with:
                  change_path: "./"
                  version_format: "${major}.${minor}.${patch}"
                  search_commit_body: true
                  bump_each_commit: true

    build:
        name: Build - v${{ needs.get-vars.outputs.version }}
        needs: [ get-vars ]
        uses: ./.github/workflows/_build.yml
        secrets: inherit
        with:
            java_vendor: temurin
            java_version: 17
            version: ${{ needs.get-vars.outputs.version }}

    publish-maven:
        needs: [ get-vars, build ]
        if: success()
        uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
        secrets: inherit
        with:
            java_version: 17
            java_vendor: temurin
            version: ${{ needs.get-vars.outputs.version }}

    publish-main:
        needs: [ get-vars, build ]
        if: success()
        uses: ./.github/workflows/_publish-furnitureset.yml
        secrets: inherit
        with:
            java_version: 17
            java_vendor: temurin
            version: ${{ needs.get-vars.outputs.version }}
            curseforge_id: 579564
            modrinth_id: A0nfCqYw
            release_type: alpha
            name: "Fantasy's Furniture"
            logo: "https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/new/fantasyfurniture.png"
            color: "9946855" # 97C6E7
            artifact_id: fantasyfurniture

    publish-nordic:
        needs: [ get-vars, build ]
        if: success()
        uses: ./.github/workflows/_publish-furnitureset.yml
        secrets: inherit
        with:
            java_version: 17
            java_vendor: temurin
            version: ${{ needs.get-vars.outputs.version }}
            curseforge_id: 1191799
            modrinth_id: DIHzMa8h
            release_type: alpha
            name: "Fantasy's Furniture - Nordic"
            logo: "https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/new/fantasyfurniture_nordic.png"
            color: "9946855" # 97C6E7
            artifact_id: fantasyfurniture-nordic

    publish-venthyr:
        needs: [ get-vars, build ]
        if: success()
        uses: ./.github/workflows/_publish-furnitureset.yml
        secrets: inherit
        with:
            java_version: 17
            java_vendor: temurin
            version: ${{ needs.get-vars.outputs.version }}
            curseforge_id: 1206300
            modrinth_id: FjHW4JvP
            release_type: alpha
            name: "Fantasy's Furniture - Venthyr"
            logo: "https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/new/fantasyfurniture_venthyr.png"
            color: "15433856" # EB8080
            artifact_id: fantasyfurniture-venthyr

    publish-bone:
        needs: [ get-vars, build ]
        if: success()
        uses: ./.github/workflows/_publish-furnitureset.yml
        secrets: inherit
        with:
            java_version: 17
            java_vendor: temurin
            version: ${{ needs.get-vars.outputs.version }}
            curseforge_id: 1209697
            modrinth_id: oJ4TI49S
            release_type: alpha
            name: "Fantasy's Furniture - Bone"
            logo: "https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/new/fantasyfurniture_bone.png"
            color: "16775652" # FFF9E4
            artifact_id: fantasyfurniture-bone
