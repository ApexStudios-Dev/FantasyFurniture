name: Test PR

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-vars:
    name: Generate Vars
    uses: ApexStudios-Dev/.github/.github/workflows/_generate-vars.yml@master
    secrets: inherit

  generate-tasks:
    name: Generate Tasks
    runs-on: ubuntu-latest
    outputs:
      main-changed: ${{ steps.changes.outputs.main }}
      nordic-changed: ${{ steps.changes.outputs.nordic }}
      venthyr-changed: ${{ steps.changes.outputs.venthyr }}
      bone-changed: ${{ steps.changes.outputs.bone }}
      dunmer-changed: ${{ steps.changes.outputs.dunmer }}
      necrolord-changed: ${{ steps.changes.outputs.necrolord }}
      royal-changed: ${{ steps.changes.outputs.royal }}
    steps:
      - name: Determine changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main: [ 'src/**' ]
            nordic: [ 'nordic/**' ]
            venthyr: [ 'venthyr/**' ]
            bone: [ 'bone/**' ]
            dunmer: [ 'dunmer/**' ]
            necrolord: [ 'necrolord/**' ]
            royal: [ 'royal/**' ]

  print:
    name: Print
    runs-on: ubuntu-latest
    needs: generate-tasks
    if: success()
    steps:
      - name: Print
        run: |
          echo Main: $MAIN_CHANGED
          echo Nordic: $NORDIC_CHANGED
          echo Venthyr: $VENTHYR_CHANGED
          echo Bone: $BONE_CHANGED
          echo Dunmer: $DUNMER_CHANGED
          echo Necrolord: $NECROLORD_CHANGED
          echo Royal: $ROYAL_CHANGED
        env:
          MAIN_CHANGED: ${{ needs.generate-tasks.outputs.main-changed }}
          NORDIC_CHANGED: ${{ needs.generate-tasks.outputs.nordic-changed }}
          VENTHYR_CHANGED: ${{ needs.generate-tasks.outputs.venthyr-changed }}
          BONE_CHANGED: ${{ needs.generate-tasks.outputs.bone-changed }}
          DUNMER_CHANGED: ${{ needs.generate-tasks.outputs.dunmer-changed }}
          NECROLORD_CHANGED: ${{ needs.generate-tasks.outputs.necrolord-changed }}
          ROYAL_CHANGED: ${{ needs.generate-tasks.outputs.royal-changed }}

  build:
    name: Build
    needs: generate-vars
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_build.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}

  check-local-changes-main:
    name: Check local changes (Main)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.main-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runData'

  check-local-changes-nordic:
    name: Check local changes (Nordic)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.nordic-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runNordicData'

  check-local-changes-venthyr:
    name: Check local changes (Venthyr)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.venthyr-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runVenthyrData'

  check-local-changes-bone:
    name: Check local changes (Bone)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.bone-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runBoneData'

  check-local-changes-dunmer:
    name: Check local changes (Dunmer)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.dunmer-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runDunmerData'

  check-local-changes-necrolord:
    name: Check local changes (Necrolord)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.necrolord-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runNecrolordData'

  check-local-changes-royal:
    name: Check local changes (Royal)
    needs: [ generate-vars, generate-tasks, build ]
    if: ${{ success() && needs.generate-tasks.outputs.royal-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      data-task: ':runRoyalData'

  publish-maven-main:
    name: Publish Maven (Main)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-main ]
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishReleasePublicationTo-PrivateRepository'

  publish-maven-nordic:
    name: Publish Maven (Nordic)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-nordic ]
    if: ${{ success() && needs.generate-tasks.outputs.nordic-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishNordicReleasePublicationTo-PrivateRepository'

  publish-maven-venthyr:
    name: Publish Maven (Venthyr)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-venthyr ]
    if: ${{ success() && needs.generate-tasks.outputs.venthyr-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishVenthyrReleasePublicationTo-PrivateRepository'

  publish-maven-bone:
    name: Publish Maven (Bone)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-bone ]
    if: ${{ success() && needs.generate-tasks.outputs.bone-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishBoneReleasePublicationTo-PrivateRepository'

  publish-maven-dunmer:
    name: Publish Maven (Dunmer)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-dunmer ]
    if: ${{ success() && needs.generate-tasks.outputs.dunmer-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishDunmerReleasePublicationTo-PrivateRepository'

  publish-maven-necrolord:
    name: Publish Maven (Necrolord)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-necrolord ]
    if: ${{ success() && needs.generate-tasks.outputs.necrolord-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishNecrolordReleasePublicationTo-PrivateRepository'

  publish-maven-royal:
    name: Publish Maven (Royal)
    needs: [ generate-vars, generate-tasks, build, check-local-changes-royal ]
    if: ${{ success() && needs.generate-tasks.outputs.royal-changed == 'true' }}
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishRoyalReleasePublicationTo-PrivateRepository'

  test:
    name: Test Production
    runs-on: apexstudios
    needs: [ generate-vars, generate-tasks, publish-maven-main, publish-maven-nordic, publish-maven-venthyr, publish-maven-bone, publish-maven-dunmer, publish-maven-necrolord, publish-maven-royal ]
    if: success()
    steps:
      - name: Prepare Environment
        run: |
          mkdir mods
          wget -O "mods/apexcore-$APEXCORE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/apexcore/$APEXCORE_VERSION/apexcore-$APEXCORE_VERSION.jar"
          wget -O "mods/fantasyfurniture-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-${{ needs.generate-vars.outputs.version }}.jar"

          if [[ "$NORDIC_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-nordic-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-nordic/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-nordic-${{ needs.generate-vars.outputs.version }}.jar"
          fi

          if [[ "$VENTHYR_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-venthyr-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-venthyr/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-venthyr-${{ needs.generate-vars.outputs.version }}.jar"
          fi

          if [[ "$BONE_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-bone-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-bone/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-bone-${{ needs.generate-vars.outputs.version }}.jar"
          fi

          if [[ "$DUNMER_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-dunmer-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-dunmer/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-dunmer-${{ needs.generate-vars.outputs.version }}.jar"
          fi

          if [[ "$NECROLORD_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-necrolord-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-necrolord/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-necrolord-${{ needs.generate-vars.outputs.version }}.jar"
          fi

          if [[ "$ROYAL_CHANGED" == "true" ]]; then
            wget -O "mods/fantasyfurniture-royal-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-royal/${{ needs.generate-vars.outputs.version }}/fantasyfurniture-royal-${{ needs.generate-vars.outputs.version }}.jar"
          fi
        env:
          APEXCORE_VERSION: 21.5.3
          NORDIC_CHANGED: ${{ needs.generate-tasks.outputs.nordic-changed }}
          VENTHYR_CHANGED: ${{ needs.generate-tasks.outputs.venthyr-changed }}
          BONE_CHANGED: ${{ needs.generate-tasks.outputs.bone-changed }}
          DUNMER_CHANGED: ${{ needs.generate-tasks.outputs.dunmer-changed }}
          NECROLORD_CHANGED: ${{ needs.generate-tasks.outputs.necrolord-changed }}
          ROYAL_CHANGED: ${{ needs.generate-tasks.outputs.royal-changed }}

      - name: Test Production Server
        uses: ApexStudios-Dev/.github/actions/test-production-server@master
        with:
          java-version: 21
          java-vendor: temurin
          neoforge-version: 21.5.34-beta
