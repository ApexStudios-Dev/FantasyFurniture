on:
    workflow_call:
        inputs:
            java_version:
                type: string
                required: true
            java_vendor:
                type: string
                required: true
            version:
                type: string
                required: true
            artifact_id:
                type: string
                default: artifacts
            curseforge_id:
                type: string
                required: true
            modrinth_id:
                type: string
                required: true
            release_type:
                type: string
                required: true
            name:
                type: string
                required: true
            logo:
                type: string
                required: true
            color:
                type: string
                required: true

jobs:
    publish-curseforge:
        uses: ApexStudios-Dev/.github/.github/workflows/_publish-curseforge.yml@master
        secrets: inherit
        with:
            java_version: ${{ inputs.java_version }}
            java_vendor: ${{ inputs.java_vendor }}
            artifact_id: ${{ inputs.artifact_id }}
            version: ${{ inputs.version }}
            curseforge_id: ${{ inputs.curseforge_id }}
            release_type: ${{ inputs.release_type }}
            name: ${{ inputs.name }}

    publish-modrinth:
        uses: ApexStudios-Dev/.github/.github/workflows/_publish-modrinth.yml@master
        secrets: inherit
        with:
            java_version: ${{ inputs.java_version }}
            java_vendor: ${{ inputs.java_vendor }}
            artifact_id: ${{ inputs.artifact_id }}
            version: ${{ inputs.version }}
            modrinth_id: ${{ inputs.modrinth_id }}
            release_type: ${{ inputs.release_type }}
            name: ${{ inputs.name }}

    announce-discord:
        needs: [ publish-curseforge, publish-modrinth ]
        if: success()
        uses: ApexStudios-Dev/.github/.github/workflows/_announce-discord.yml@master
        secrets: inherit
        with:
            version: ${{ inputs.version }}
            name: ${{ inputs.name }}
            logo: ${{ inputs.logo }}
            color: ${{ inputs.color }}
