name: Check Local Changes

on:
    pull_request:
        types:
            - synchronize
            - opened
            - ready_for_review
            - reopened

permissions:
    contents: read
    pull-requests: read

jobs:
    determine-module-changes:
        name: Determine Module Changes
        uses: ./.github/workflows/_module-changes.yml

    check-local-changes:
        name: Check Local Changes
        needs: determine-module-changes
        runs-on: apexstudios
        if: needs.determine-module-changes.outputs.changes != '[]'
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Setup Java
              uses: ApexStudios-Dev/.github/actions/setup-java@master

            - name: Setup Gradle
              uses: ApexStudios-Dev/.github/actions/setup-gradle@master

            - name: Generate Data
              shell: bash
              run: ./gradlew :generateModulesData
              env:
                  VERSION: ${{ steps.checkout.outputs.version }}
                  DATA_MODULES: ${{ join(fromJSON(needs.determine-module-changes.outputs.changes)) }}

            # This is needed otherwise the 'git status' below reports as 'gradlew' being changed
            # Tried running 'git update-index --chmod=+x ./gradlew' to have perms tracked but this did not work
            - name: Mark Gradle as not Executable
              run: chmod -x ./gradlew

            - name: Check no local changes are present
              shell: bash
              run: |
                git status
                if [ -n "$(git status --porcelain)" ]; then exit 1; fi
