on:
    pull_request:
        types:
            - synchronize
            - opened
            - ready_for_review
            - reopened

jobs:
    check-local-changes:
        runs-on: apexstudios
        steps:
            - name: Checkout repository
              uses: neoforged/actions/checkout@main

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-disabled: ${{ ! env.ACT }}
                  cache-read-only: false

            - name: Mark Gradle as Executable
              run: chmod +x ./gradlew

            - name: Run datagen
              run: ./gradlew :runData :runNordicData :runVenthyrData :runBoneData :runDunmerData

            - name: Check no local changes are present
              run: |
                git status
                if [ -n "$(git status --porcelain" ]; then exit 1; fi
