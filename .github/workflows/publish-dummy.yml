name: Publish Dummy

on:
  pull_request:
    types:
      - synchronize
      - opened

permissions:
  contents: read
  pull-requests: read

jobs:
  determine-changes:
    name: Determine changes
    runs-on: ubuntu-latest
    outputs:
      main-changed: ${{ steps.changes.outputs.main }}
      nordic-changed: ${{ steps.changes.outputs.nordic }}
      venthyr-changed: ${{ steps.changes.outputs.venthyr }}
      bone-changed: ${{ steps.changes.outputs.bone }}
      dunmer-changed: ${{ steps.changes.outputs.dunmer }}
      necrolord-changed: ${{ steps.changes.outputs.necrolord }}
      royal-changed: ${{ steps.changes.outputs.royal }}
      decorations-changed: ${{ steps.changes.outputs.decorations }}
    steps:
      - name: Checkout Repository
        uses: ApexStudios-Dev/.github/actions/checkout@master

      - name: Determine changes
        id: changes
        uses: dorny/paths-filter@v4.0.1
        with:
          base: 26.1/main
          filters: |
            main: [ 'src/**' ]
            nordic: [ 'nordic/src/**' ]
            venthyr: [ 'venthyr/src/**' ]
            bone: [ 'bone/src/**' ]
            dunmer: [ 'dunmer/src/**' ]
            necrolord: [ 'necrolord/src/**' ]
            royal: [ 'royal/src/**' ]
            decorations: [ 'decorations/src/**' ]

  publish-main-dummy:
    name: Publish Main Dummy
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-dummy.yml@master
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.main-changed == 'true' }}
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      artifact-id: fantasyfurniture
      display-name: Fantasy's Furniture
      use-self-runner: false
      build-task: ':build'

  publish-nordic-dummy:
    name: Publish Nordic Dummy
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-dummy.yml@master
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.nordic-changed == 'true' }}
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      artifact-id: fantasyfurniture_nordic
      display-name: Fantasy's Furniture - Nordic
      use-self-runner: false
      build-task: ':fantasyfurniture_nordic:build'

  publish-venthyr-dummy:
    name: Publish Venthyr Dummy
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-dummy.yml@master
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.venthyr-changed == 'true' }}
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      artifact-id: fantasyfurniture_venthyr
      display-name: Fantasy's Furniture - Venthyr
      use-self-runner: false
      build-task: ':fantasyfurniture_venthyr:build'

  publish-bone-dummy:
