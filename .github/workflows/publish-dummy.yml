    uses: ApexStudios-Dev/.github/.github/workflows/_publish-dummy.yml@master
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.bone-changed == 'true' }}
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      artifact-id: fantasyfurniture_bone
      display-name: Fantasy's Furniture - Bone
      use-self-runner: false
