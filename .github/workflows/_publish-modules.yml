name: Publish Modules

on:
    workflow_call:
        inputs:
            modules:
                type: string
                required: true
            release_type:
                type: string
                required: true

jobs:
    parse-modules:
        name: Parse Modules
        runs-on: ubuntu-latest
        if: inputs.modules != '[]'
        outputs:
            modules: ${{ steps.modules.outputs.json }}
        steps:
            - name: Checkout Repository
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Parse Modules
              id: modules
              uses: ApexStudios-Dev/.github/actions/parse-json@master
              with:
                  path: ./.github/workflows/modules.json

    build:
        name: Build
        runs-on: apexstudios
        needs: parse-modules
        if: ${{ success() && inputs.modules != '[]' }}
        outputs:
            timestamp: ${{ steps.timestamp.outputs.output }}
            version: ${{ steps.checkout.outputs.version }}
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Setup Java
              uses: ApexStudios-Dev/.github/actions/setup-java@master

            - name: Build with Gradle
              uses: ApexStudios-Dev/.github/actions/run-gradle@master
              with:
                  setup: true
                  tasks: :build
              env:
                  VERSION: ${{ steps.checkout.outputs.version }}

            - name: Generate Timestamp
              id: timestamp
              shell: bash
              run: echo "output=$(date --iso-8601=seconds)" >> $GITHUB_OUTPUT

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts
                  path: ./build/libs/*.jar
                  if-no-files-found: error

    publish-maven:
        name: Publish to Maven
        needs: [ parse-modules, build]
        if: ${{ success() && inputs.modules != '[]' }}
        runs-on: apexstudios
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Setup Java
              uses: ApexStudios-Dev/.github/actions/setup-java@master

            - name: Build with Gradle
              uses: ApexStudios-Dev/.github/actions/run-gradle@master
              if: ${{ !env.ACT }}
              with:
                  setup: true
                  tasks: :publishModulesToMaven
              env:
                  VERSION: ${{ steps.checkout.outputs.version }}
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
                  PUBLISH_MODULES: ${{ inputs.modules }}

    publish-modules:
        name: Publish Module - ${{ matrix.module }}
        needs: [ parse-modules, build, publish-maven ]
        if: ${{ success() && inputs.modules != '[]' }}
        uses: ./.github/workflows/_publish-module.yml
        secrets: inherit
        strategy:
            matrix:
                module: ${{ fromJSON(inputs.modules) }}
        with:
            version: ${{ needs.build.outputs.version }}
            build_timestamp: ${{ needs.build.outputs.timestamp }}
            release_type: ${{ inputs.release_type }}
            module: ${{ matrix.module }}
            modules_json: ${{ needs.parse-modules.outputs.modules }}
