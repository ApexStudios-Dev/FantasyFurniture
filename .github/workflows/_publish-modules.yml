name: Publish Modules

on:
    workflow_call:
        inputs:
            modules:
                type: string
                required: true
            release_type:
                type: string
                required: true
            is_manual:
              type: boolean
              required: true

jobs:
    parse-modules:
        name: Parse Modules
        runs-on: ubuntu-latest
        if: ${{ inputs.modules != '' && inputs.modules != '[]' }}
        outputs:
            version: ${{ steps.checkout.outputs.version }}
            modules: ${{ steps.modules.outputs.json }}
            split: ${{ steps.split.outputs.split }}
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Parse Modules
              id: modules
              uses: ApexStudios-Dev/.github/actions/parse-json@master
              with:
                  path: ./.github/workflows/modules.json

            - name: Split Modules
              id: split
              if: inputs.is_manual
              run: echo "split=$(echo '"${{ inputs.modules }}"' | jq -r -c '. | split(",") | map(select(length > 0))')" >> $GITHUB_OUTPUT

    build:
        name: Build
        runs-on: apexstudios
        needs: parse-modules
        if: ${{ success() && inputs.modules != '' && inputs.modules != '[]' }}
        outputs:
            timestamp: ${{ steps.timestamp.outputs.output }}
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Setup Java
              uses: ApexStudios-Dev/.github/actions/setup-java@master

            - name: Setup Gradle
              uses: ApexStudios-Dev/.github/actions/setup-gradle@master

            - name: Build with Gradle
              run: ./gradlew :build
              env:
                  VERSION: ${{ steps.checkout.outputs.version }}

            - name: Generate Timestamp
              id: timestamp
              run: echo "output=$(date --iso-8601=seconds)" >> $GITHUB_OUTPUT

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts
                  path: ./build/libs/*.jar
                  if-no-files-found: error

    publish-maven:
        name: Publish to Maven
        needs: [ parse-modules, build ]
        if: ${{ success() && inputs.modules != '' && inputs.modules != '[]' }}
        runs-on: apexstudios
        steps:
            - name: Checkout Repository
              id: checkout
              uses: ApexStudios-Dev/.github/actions/checkout@master

            - name: Setup Java
              uses: ApexStudios-Dev/.github/actions/setup-java@master

            - name: Setup Gradle
              uses: ApexStudios-Dev/.github/actions/setup-gradle@master

            - name: Build with Gradle
#              if: ${{ !env.ACT }}
              run: ./gradlew :publishModulesToMaven
              env:
                  VERSION: ${{ steps.checkout.outputs.version }}
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
                  PUBLISH_MODULES: ${{ inputs.is_manual && inputs.modules || join(fromJSON(inputs.modules)) }}

    publish-modules:
        name: Publish Module - ${{ matrix.module }}
        needs: [ parse-modules, build, publish-maven ]
        if: ${{ success() && inputs.modules != '' && inputs.modules != '[]' }}
        uses: ./.github/workflows/_publish-module.yml
        secrets: inherit
        strategy:
            matrix:
                module: ${{ inputs.is_manual && fromJSON(needs.parse-modules.outputs.split) || fromJSON(inputs.modules) }}
        with:
            version: ${{ needs.parse-modules.outputs.version }}
            build_timestamp: ${{ needs.build.outputs.timestamp }}
            release_type: ${{ inputs.release_type }}
            module: ${{ matrix.module }}
            modules_json: ${{ needs.parse-modules.outputs.modules }}
