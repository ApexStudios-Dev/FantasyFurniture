name: Build PR

on:
  pull_request:
    types:
      - synchronize
      - opened

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ApexStudios-Dev/.github/.github/workflows/_build.yml@master
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      use-self-runner: false
      build-task: ':build :fantasyfurniture_nordic:build :fantasyfurniture_venthyr:build :fantasyfurniture_bone:build :fantasyfurniture_dunmer:build :fantasyfurniture_necrolord:build :fantasyfurniture_royal:build :fantasyfurniture_decorations:build'